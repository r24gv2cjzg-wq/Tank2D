name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Project ZIP
        run: |
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then echo "ZIP не найден!" && exit 1; fi
          unzip -o "$ZIP_FILE"

      - name: Patch Project for 3D and No-Sign
        run: |
          XCODEPROJ=$(find . -name "Tank2D.xcodeproj" | head -n 1)
          if [ -z "$XCODEPROJ" ]; then echo "Tank2D.xcodeproj не найден!" && exit 1; fi
          PROJECT_DIR=$(dirname "$XCODEPROJ")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          
          # Глубокая очистка подписи в файле проекта
          sed -i '' 's/DevelopmentTeam = .*/DevelopmentTeam = "";/g' "$XCODEPROJ/project.pbxproj"
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' "$XCODEPROJ/project.pbxproj"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$XCODEPROJ/project.pbxproj"
          sed -i '' 's/CODE_SIGN_IDENTITY = .*/CODE_SIGN_IDENTITY = "";/g' "$XCODEPROJ/project.pbxproj"
          
          # Отключаем обязательную валидацию ассетов (критично для 3D)
          sed -i '' 's/ASSETCATALOG_COMPILER_APPICON_NAME = .*/ASSETCATALOG_COMPILER_APPICON_NAME = "";/g' "$XCODEPROJ/project.pbxproj"

      - name: Build App
        run: |
          cd "$PROJECT_DIR"
          
          # Собираем строго схему Tank2D с отключением всех проверок подписи
          xcodebuild build \
            -project Tank2D.xcodeproj \
            -scheme Tank2D \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then echo ".app не найден!" && exit 1; fi
          cp -r "$APP_PATH" Payload/
          zip -r App.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: App.ipa
