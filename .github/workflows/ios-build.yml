name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Project ZIP
        run: |
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then echo "ZIP не найден!" && exit 1; fi
          unzip -o "$ZIP_FILE"

      - name: Patch Project settings
        run: |
          XCODEPROJ=$(find . -name "Tank2D.xcodeproj" | head -n 1)
          if [ -z "$XCODEPROJ" ]; then echo "Tank2D.xcodeproj не найден!" && exit 1; fi
          PROJECT_DIR=$(dirname "$XCODEPROJ")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          
          sed -i '' 's/DevelopmentTeam = .*/DevelopmentTeam = "";/g' "$XCODEPROJ/project.pbxproj"
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' "$XCODEPROJ/project.pbxproj"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$XCODEPROJ/project.pbxproj"
          sed -i '' 's/CODE_SIGN_IDENTITY = .*/CODE_SIGN_IDENTITY = "";/g' "$XCODEPROJ/project.pbxproj"
          sed -i '' 's/SWIFT_TREAT_WARNINGS_AS_ERRORS = YES;/SWIFT_TREAT_WARNINGS_AS_ERRORS = NO;/g' "$XCODEPROJ/project.pbxproj"

      - name: Build App
        run: |
          cd "$PROJECT_DIR"
          
          # Запускаем сборку и сохраняем лог в файл build.log
          xcodebuild build \
            -project Tank2D.xcodeproj \
            -scheme Tank2D \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_SUPPRESS_WARNINGS=YES \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            GCC_WARN_INHIBIT_ALL_WARNINGS=YES > build.log 2>&1 || true

      - name: Показать только критические ошибки
        run: |
          cd "$PROJECT_DIR"
          echo "=== СПИСОК КРИТИЧЕСКИХ ОШИБОК ==="
          # Ищем в логе строки с ошибками компиляции Swift/Xcode
          grep -i -E "error:|failed|fatal" build.log | tail -n 20
          echo "================================="
          
          # Проверяем, создался ли вообще .app файл
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Сборка завершилась неудачно из-за ошибок кода выше."
            exit 1
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r App.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: App.ipa
