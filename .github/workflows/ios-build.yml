name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Find and Build App
        run: |
          # Этот скрипт сам найдет файл проекта, даже если он лежит глубоко в папках
          XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)
          PROJECT_DIR=$(dirname "$XCODEPROJ")
          SCHEME_NAME=$(xcodebuild -list -project "$XCODEPROJ" | awk '/Schemes:/{flag=1;next}/^[[:space:]]*$/{flag=0}flag' | sed 's/^[[:space:]]*//' | head -n 1)
          
          echo "Найден проект: $XCODEPROJ"
          echo "Найдена схема: $SCHEME_NAME"
          
          cd "$PROJECT_DIR"
          xcodebuild build \
            -project $(basename "$XCODEPROJ") \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir Payload
          # Ищем собранное приложение и упаковываем в IPA
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d -exec cp -r {} Payload/ \;
          zip -r App.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: App.ipa
