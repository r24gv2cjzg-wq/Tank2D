name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Project ZIP
        run: |
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then echo "ZIP не найден!" && exit 1; fi
          unzip -o "$ZIP_FILE"

      - name: Auto-Detect Project and Patch Settings
        run: |
          # Сам находит любой xcodeproj файл, как бы он ни назывался после обновления
          XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)
          if [ -z "$XCODEPROJ" ]; then echo "Файл .xcodeproj не найден!" && exit 1; fi
          PROJECT_DIR=$(dirname "$XCODEPROJ")
          XCODEPROJ_NAME=$(basename "$XCODEPROJ")
          
          # Автоматически вытаскиваем имя новой 3D схемы приложения
          SCHEME_NAME=$(xcodebuild -list -project "$XCODEPROJ" | awk '/Schemes:/{flag=1;next}/^[[:space:]]*$/{flag=0}flag' | sed 's/^[[:space:]]*//' | head -n 1)
          
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "XCODEPROJ_NAME=$XCODEPROJ_NAME" >> $GITHUB_ENV
          echo "SCHEME_NAME=$SCHEME_NAME" >> $GITHUB_ENV
          
          echo "=== АВТООПРЕДЕЛЕНИЕ ==="
          echo "Найден проект: $XCODEPROJ_NAME"
          echo "Найдена схема: $SCHEME_NAME"
          echo "======================="
          
          # Очищаем подпись под новые файлы
          sed -i '' 's/DevelopmentTeam = .*/DevelopmentTeam = "";/g' "$XCODEPROJ/project.pbxproj"
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' "$XCODEPROJ/project.pbxproj"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$XCODEPROJ/project.pbxproj"
          sed -i '' 's/CODE_SIGN_IDENTITY = .*/CODE_SIGN_IDENTITY = "";/g' "$XCODEPROJ/project.pbxproj"
          sed -i '' 's/SWIFT_TREAT_WARNINGS_AS_ERRORS = YES;/SWIFT_TREAT_WARNINGS_AS_ERRORS = NO;/g' "$XCODEPROJ/project.pbxproj"

      - name: Build App
        run: |
          cd "$PROJECT_DIR"
          
          xcodebuild build \
            -project "$XCODEPROJ_NAME" \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_SUPPRESS_WARNINGS=YES \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            GCC_WARN_INHIBIT_ALL_WARNINGS=YES > build.log 2>&1 || true

      - name: Показать только критические ошибки
        run: |
          cd "$PROJECT_DIR"
          echo "=== СПИСОК КРИТИЧЕСКИХ ОШИБОК ==="
          grep -i -E "error:|failed|fatal" build.log | tail -n 20
          echo "================================="
          
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Сборка завершилась неудачно из-за ошибок кода Swift выше."
            exit 1
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r App.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: App.ipa
